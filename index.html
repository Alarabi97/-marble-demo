<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>H الذهبية</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Tajawal',sans-serif;background:#FAF6EE;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background-image:radial-gradient(circle at 10% 20%,#F5ECD7 0%,transparent 40%),radial-gradient(circle at 90% 80%,#F5ECD7 0%,transparent 40%)}.app{max-width:420px;width:100%;background:#FDF6F3;border-radius:32px;padding:28px 20px 30px;box-shadow:0 12px 48px rgba(201,168,76,0.2),0 0 0 1px rgba(201,168,76,0.08);position:relative;overflow:hidden}.app::before,.app::after{content:'';position:absolute;border:2px solid #E8D5A3;border-radius:50%;opacity:0.15}.app::before{top:-80px;right:-80px;width:250px;height:250px}.app::after{bottom:-100px;left:-100px;width:300px;height:300px;opacity:0.1}.header{text-align:center;position:relative;z-index:2;margin-bottom:20px}.logo-ring{display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#E8D5A3,#C9A84C,#E8D5A3);box-shadow:0 8px 40px rgba(201,168,76,0.3);margin-bottom:12px;animation:pulse 3s ease-in-out infinite}.logo-ring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#FDF6F3}.logo-ring .h-letter{font-family:'Amiri',serif;font-size:52px;font-weight:700;color:#C9A84C;position:relative;z-index:2}@keyframes pulse{0%,100%{box-shadow:0 8px 40px rgba(201,168,76,0.3)}50%{box-shadow:0 8px 60px rgba(201,168,76,0.5)}}.header h1{font-family:'Amiri',serif;font-size:24px;color:#2C241C}.header .subtitle{color:#6B5F53;font-size:14px;font-weight:300}.divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,#C9A84C,transparent);margin:10px auto 0}.role-selector{display:flex;gap:8px;margin:16px 0 20px;position:relative;z-index:2}.role-btn{flex:1;padding:10px 8px;border:2px solid #E8D5A3;border-radius:14px;background:transparent;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:600;color:#6B5F53;cursor:pointer;text-align:center;transition:all 0.3s ease}.role-btn:hover{background:#F5ECD7}.role-btn.active{background:linear-gradient(135deg,#E8D5A3,#C9A84C);border-color:#C9A84C;color:#fff;box-shadow:0 4px 16px rgba(201,168,76,0.25)}.role-btn .icon{display:block;font-size:20px;margin-bottom:2px}.content{background:#FAF6EE;border-radius:20px;padding:20px 18px;position:relative;z-index:2;min-height:300px;border:1px solid rgba(201,168,76,0.08)}.events-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.events-header h2{font-size:18px;color:#2C241C}.events-header h2 .gold{color:#C9A84C}.add-btn{background:linear-gradient(135deg,#E8D5A3,#C9A84C);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(201,168,76,0.25);display:flex;align-items:center;justify-content:center;transition:all 0.3s ease}.add-btn:hover{transform:scale(1.05) rotate(90deg)}.event-item{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,0.04);border-right:4px solid #C9A84C;display:flex;justify-content:space-between;align-items:center}.event-item .title{font-weight:700;font-size:15px}.event-item .meta{font-size:12px;color:#6B5F53;margin-top:2px}.event-actions{display:flex;gap:6px;margin-top:6px}.event-actions button{background:0 0;border:none;font-size:16px;cursor:pointer;padding:2px 6px;border-radius:8px;transition:all 0.3s ease}.event-actions button:hover{background:#F5ECD7}.status{font-size:11px;padding:4px 12px;border-radius:999px;font-weight:700}.status-active{background:#E8F5E9;color:#2E7D32}.status-upcoming{background:#FFF3E0;color:#E65100}.status-done{background:#F5F5F5;color:#757575}.staff-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}.staff-item .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#E8D5A3,#C9A84C);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700}.staff-item .info{flex:1}.staff-item .name{font-weight:600;font-size:14px}.staff-item .role{font-size:12px;color:#6B5F53}.staff-item .perms{font-size:11px;background:#F5ECD7;padding:2px 10px;border-radius:999px;color:#8A5F2D}.perm-badge{font-size:11px;padding:4px 12px;border-radius:999px;background:#F5ECD7;color:#8A5F2D;font-weight:600}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,36,28,0.4);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:20px}.modal-overlay.show{display:flex}.modal{background:#FDF6F3;border-radius:28px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 12px 48px rgba(201,168,76,0.25);animation:modalIn 0.3s ease}@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}.modal h3{font-family:'Amiri',serif;font-size:22px;color:#C9A84C;margin-bottom:16px;text-align:center}.modal .field{margin-bottom:14px}.modal .field label{display:block;font-size:13px;font-weight:600;color:#6B5F53;margin-bottom:4px}.modal .field input,.modal .field textarea{width:100%;padding:12px 14px;border:2px solid #E8E0D8;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:14px;background:#fff;transition:all 0.3s ease}.modal .field input:focus,.modal .field textarea:focus{outline:0;border-color:#C9A84C;box-shadow:0 0 0 4px rgba(201,168,76,0.08)}.modal .field textarea{resize:vertical;min-height:60px}.modal-actions{display:flex;gap:10px;margin-top:16px}.modal-actions button{flex:1;padding:12px;border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:all 0.3s ease}.modal-actions .btn-confirm{background:linear-gradient(135deg,#E8D5A3,#C9A84C);color:#fff;box-shadow:0 4px 16px rgba(201,168,76,0.25)}.modal-actions .btn-confirm:hover{transform:translateY(-2px)}.modal-actions .btn-cancel{background:#F0EDE8;color:#6B5F53}.modal-actions .btn-cancel:hover{background:#E5E0D8}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#2C241C;color:#fff;padding:14px 28px;border-radius:16px;font-family:'Tajawal',sans-serif;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,0.2);z-index:2000;opacity:0;transition:all 0.4s ease;text-align:center;max-width:90%}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:480px){.app{padding:16px 14px 20px;border-radius:24px}.logo-ring{width:90px;height:90px}.logo-ring .h-letter{font-size:42px}.header h1{font-size:20px}.role-btn{font-size:11px;padding:8px 4px}.content{padding:16px 14px}.event-item{padding:12px 14px;flex-wrap:wrap}.modal{padding:20px 16px}}
</style></head><body>
<div class="app"><div class="header"><div class="logo-ring"><span class="h-letter">H</span></div><h1>منصة إحسان</h1><div class="subtitle">✦ لإدارة الفعاليات والمناسبات ✦</div><div class="divider"></div></div>
<div class="role-selector"><button class="role-btn active" id="roleAdmin"><span class="icon">👑</span>إحسان (مديرة)</button><button class="role-btn" id="roleStaff"><span class="icon">👩‍💼</span>مساعدة</button></div>
<div class="content" id="contentArea"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal"><h3>✨ إضافة فعالية جديدة</h3><div class="field"><label>اسم الفعالية</label><input type="text" id="eventTitle" placeholder="مثال: حفل عشاء عائلي"></div><div class="field"><label>التاريخ</label><input type="date" id="eventDate"></div><div class="field"><label>الوصف (اختياري)</label><textarea id="eventDesc" placeholder="تفاصيل إضافية..."></textarea></div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">إلغاء</button><button class="btn-confirm" onclick="addEvent()">➕ إضافة</button></div></div></div>
<div class="toast" id="toast"></div></div>
<script>
let events=[{id:1,title:'حفل زفاف سارة',date:'2024-12-20',desc:'قاعة الفردوس',status:'active'},{id:2,title:'عشاء عائلي',date:'2024-12-25',desc:'منزل العائلة',status:'upcoming'},{id:3,title:'حفل خطوبة ليلى',date:'2024-12-10',desc:'فندق كورنثيا',status:'done'}];
let staff=[{name:'نورة',role:'مساعدة أولى',perms:['عرض','تعديل']},{name:'منى',role:'مساعدة',perms:['عرض']}];
let currentRole='admin',idCounter=4;
const content=document.getElementById('contentArea'),modal=document.getElementById('modalOverlay'),toast=document.getElementById('toast'),roleAdmin=document.getElementById('roleAdmin'),roleStaff=document.getElementById('roleStaff');
function render(){if(currentRole==='admin')renderAdmin();else renderStaff();updateButtons()}
function renderAdmin(){let h='<div class="events-header"><h2>📋 الفعاليات <span class="gold">('+events.length+')</span></h2><button class="add-btn" onclick="openModal()">+</button></div>';events.forEach(e=>{h+='<div class="event-item"><div class="info"><div class="title">'+e.title+'</div><div class="meta">📅 '+formatDate(e.date)+(e.desc?' • '+e.desc:'')+'</div><div class="event-actions"><button onclick="deleteEvent('+e.id+')">🗑️</button><button onclick="toggleStatus('+e.id+')">🔄</button></div></div><span class="status status-'+e.status+'">'+statusLabel(e.status)+'</span></div>'});if(events.length===0)h+='<p style="text-align:center;color:#6B5F53;padding:20px 0;">لا توجد فعاليات حالياً ✨</p>';h+='<div style="margin-top:24px;padding-top:20px;border-top:1px solid rgba(201,168,76,0.15);"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 style="font-size:16px;">👩‍💼 فريق العمل <span class="gold">('+staff.length+')</span></h2><button class="add-btn" onclick="addStaff()" style="width:32px;height:32px;font-size:16px;">+</button></div>';staff.forEach(s=>{h+='<div class="staff-item"><div class="avatar">'+s.name.charAt(0)+'</div><div class="info"><div class="name">'+s.name+'</div><div class="role">'+s.role+'</div></div><div class="perms">'+s.perms.join(' • ')+'</div></div>'});h+='</div>';content.innerHTML=h}
function renderStaff(){let h='<div class="events-header"><h2>📋 الفعاليات <span class="gold">('+events.length+')</span></h2><span class="perm-badge">👀 عرض فقط</span></div>';events.forEach(e=>{h+='<div class="event-item"><div class="info"><div class="title">'+e.title+'</div><div class="meta">📅 '+formatDate(e.date)+(e.desc?' • '+e.desc:'')+'</div></div><span class="status status-'+e.status+'">'+statusLabel(e.status)+'</span></div>'});if(events.length===0)h+='<p style="text-align:center;color:#6B5F53;padding:20px 0;">لا توجد فعاليات حالياً ✨</p>';h+='<div style="margin-top:20px;padding:16px;background:#F5ECD7;border-radius:14px;text-align:center;font-size:13px;color:#6B5F53;">🕊️ يمكنك عرض الفعاليات فقط. للإدارة الكاملة، قومي بتفعيل دور المديرة.</div>';content.innerHTML=h}
function updateButtons(){roleAdmin.classList.toggle('active',currentRole==='admin');roleStaff.classList.toggle('active',currentRole==='staff')}
function formatDate(d){let dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}
function statusLabel(s){let map={active:'📌 نشط',upcoming:'⏳ قادم',done:'✅ منتهي'};return map[s]||s}
function openModal(){if(currentRole!=='admin'){showToast('⚠️ فقط المديرة يمكنها إضافة فعاليات');return}modal.classList.add('show');document.getElementById('eventTitle').value='';document.getElementById('eventDate').value='';document.getElementById('eventDesc').value='';let t=new Date();t.setDate(t.getDate()+1);document.getElementById('eventDate').value=t.toISOString().split('T')[0]}
function closeModal(){modal.classList.remove('show')}
function addEvent(){let t=document.getElementById('eventTitle').value.trim(),d=document.getElementById('eventDate').value,desc=document.getElementById('eventDesc').value.trim();if(!t||!d){showToast('⚠️ الرجاء إدخال اسم الفعالية والتاريخ');return}events.push({id:idCounter++,title:t,date:d,desc:desc||'',status:'upcoming'});closeModal();render();showToast('✅ تم إضافة الفعالية بنجاح ✨')}
function deleteEvent(id){if(currentRole!=='admin'){showToast('⚠️ فقط المديرة يمكنها الحذف');return}if(confirm('هل أنت متأكدة من الحذف؟')){events=events.filter(e=>e.id!==id);render();showToast('🗑️ تم الحذف')}}
function toggleStatus(id){if(currentRole!=='admin'){showToast('⚠️ فقط المديرة يمكنها التغيير');return}let e=events.find(ev=>ev.id===id);if(!e)return;let states=['active','upcoming','done'];let idx=states.indexOf(e.status);e.status=states[(idx+1)%states.length];render();showToast('🔄 تغيير الحالة إلى: '+statusLabel(e.status))}
function addStaff(){if(currentRole!=='admin'){showToast('⚠️ فقط المديرة يمكنها الإضافة');return}let name=prompt('👩‍💼 أدخل اسم المساعدة:');if(name&&name.trim()){let perms=confirm('منح صلاحية التعديل؟')?['عرض','تعديل']:['عرض'];staff.push({name:name.trim(),role:'مساعدة',perms});render();showToast('✅ تمت إضافة '+name.trim())}}
roleAdmin.onclick=function(){currentRole='admin';render();showToast('👑 مرحباً إحسان! صلاحية كاملة')};
roleStaff.onclick=function(){currentRole='staff';render();showToast('👩‍💼 وضع المساعدة: عرض فقط')};
let toastTimer;function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show')},2800)}
modal.onclick=function(e){if(e.target===modal)closeModal()};
render();
</script></body></html>
